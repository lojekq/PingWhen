name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
env:
  APP: TrayApp                      # tools/rename.ps1 puts the app name here
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
permissions: { contents: read }
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test -c Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - name: Publish
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ver  = '${{ github.ref_name }}'.Substring(1)
          $proj = "src/$env:APP/$env:APP.csproj"
          $c = '-c','Release','-r','win-x64','-p:PublishSingleFile=true',"-p:Version=$ver",'-p:DebugType=none'
          dotnet publish $proj @c --self-contained -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/sc
          dotnet publish $proj @c --no-self-contained -o out/fd
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "out/sc/$env:APP.exe" "dist/$env:APP-$ver-win-x64.exe"
          Compress-Archive out/fd/* "dist/$env:APP-$ver-win-x64-fd.zip"
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - name: GitHub Release
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --force --tags          # checkout turns the annotated tag into a light one; notes come from the tag
          $tag = '${{ github.ref_name }}'
          $a = @($tag) + (Get-ChildItem dist).FullName + @('--title', "$env:APP $tag", '--notes-from-tag', '--verify-tag')
          if ($tag.Contains('-')) { $a += '--prerelease' }
          if ('${{ vars.SIGN }}' -eq '1') { $a += '--draft' }   # signing is on: the owner signs and publishes (00-shared §4.4)
          gh release create @a
